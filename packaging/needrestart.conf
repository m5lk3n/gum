# Installed by the gummy package. Keep needrestart from restarting gummy.service
# after apt runs: when gummy upgrades packages itself, apt-get runs inside
# gummy.service, and restarting it from there would wait on itself until the stop
# timeout and then kill dpkg. Restart gummy manually instead.
$nrconf{override_rc}{qr(^gummy\.service$)} = 0;
