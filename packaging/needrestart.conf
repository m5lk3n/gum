# Installed by the gum package. Keep needrestart from restarting gum.service
# after apt runs: when gum upgrades packages itself, apt-get runs inside
# gum.service, and restarting it from there would wait on itself until the stop
# timeout and then kill dpkg. Restart gum manually instead.
$nrconf{override_rc}{qr(^gum\.service$)} = 0;
